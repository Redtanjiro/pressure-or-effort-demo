<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Pressure or Effort</title>
<meta name="description" content="A faceless blob shares your heartbeat and learns, with your help, what it feels.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="#welcome"><span class="dot" aria-hidden="true"></span>Pressure or Effort</a>
    <nav class="tabs" aria-label="Main">
      <a href="#today" data-tab="today">The blob's day</a>
      <a href="#review" data-tab="review">Tonight</a>
      <a href="#headspace" data-tab="headspace">What it learned</a>
      <a href="#blob" data-tab="blob">About the blob</a>
    </nav>
    <div class="topright">
      <div class="daypick" id="daypick"></div>
      <button class="tour-btn" id="tour-btn" type="button" aria-label="Walkthrough"><span aria-hidden="true">?</span><b>Walkthrough</b></button>
    </div>
  </div>
</header>
<main id="app" tabindex="-1"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="tour-spot" id="tour-spot" hidden></div>
<div class="tour" id="tour" role="dialog" aria-label="Walkthrough" hidden>
  <p class="tour-n small"></p>
  <h3></h3>
  <p class="tour-b"></p>
  <div class="btns">
    <button class="btn ghost" type="button" data-tour-act="back">Back</button>
    <button class="btn primary" type="button" data-tour-act="next">Next</button>
    <button class="tour-x" type="button" data-tour-act="close" aria-label="Close walkthrough">✕</button>
  </div>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
